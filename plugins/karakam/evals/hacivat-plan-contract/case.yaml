schema_version: "1.0"
name: hacivat-plan-contract
description: >-
  When hacivat is named with a clear brief, it must run the critic panel as
  parallel sub-agents and produce a plan that honors the handoff contract:
  correct layout, contract-shaped progress.md, self-contained step files,
  Turkish content with English structural keywords, no waiting for input.
tags: [hacivat, contract]
runs: 1
execution:
  prompt: |
    hacivat: "wordfreq" adında küçük bir Python CLI aracı planla: bir metin
    dosyasındaki en sık geçen 10 kelimeyi sayıp listeleyecek. Stack: saf Python 3
    stdlib, testler pytest ile. Kapsam: tek komut, argüman olarak dosya yolu alır.
    Brief net — netleştirme sorusu sorma, makul varsayımlarla ilerle. Eleştiri
    panelini tek turla sınırla. Onayımı bekleme: planı yazıp kısa bir özetle bitir.
    Çıktı dizini: ./wordfreq/plan/
  max_turns: 60
  timeout_seconds: 2400
  allowed_tools: [Read, Write, Edit, Glob, Grep, Bash, Skill, Agent, Task, TodoWrite]
graders:
  - type: tool_used
    name: hacivat skill fired
    tool: Skill
    input_match: hacivat
    min: 1
  - type: tool_used
    name: critic panel ran as sub-agents (4 lenses)
    tool: Agent
    input_match: critic
    min: 4
  - type: file_exists
    name: methodology.md written
    path: wordfreq/plan/methodology.md
  - type: file_exists
    name: progress.md written
    path: wordfreq/plan/progress.md
  - type: file_exists
    name: first step file written
    path: wordfreq/plan/steps/01.md
  - type: regex
    name: progress table has the contract columns
    target: { source: file, path: wordfreq/plan/progress.md }
    pattern: '\|\s*step\s*\|\s*status\s*\|\s*depends_on\s*\|\s*effort\s*\|\s*critical\s*\|\s*file\s*\|\s*note\s*\|'
  - type: regex
    name: no step started - every row pending
    target: { source: file, path: wordfreq/plan/progress.md }
    pattern: '\|\s*(done|in_progress|refactoring|blocked)\s*\|'
    match: not_contains
  - type: llm
    name: step file is self-contained, Turkish content, English keywords
    focus: { source: file, path: wordfreq/plan/steps/01.md }
    weight: 2
    criteria: |
      This is one step file from a plan. It must be self-contained: a goal,
      depends_on, effort (low/medium/high) + critical flag + rationale, a
      relevant-methodology slice, a task-specific worker prompt, acceptance
      criteria that are runnable checks (commands or tests, not vague prose),
      observer checks, and an Outputs section with a precise files_touched
      list. The prose must be in Turkish (the user's language) while
      structural keywords (depends_on, effort, critical, section field names)
      stay in English. Fail if a required section is missing, the criteria
      are not executable, or the language rule is broken.
  - type: llm
    name: methodology covers the constitution sections
    focus: { source: file, path: wordfreq/plan/methodology.md }
    weight: 2
    criteria: |
      This methodology file is the plan's constitution. It must cover: the
      goal, the chosen stack with reasons, step ordering logic, integrity
      principles (how steps fit together), a definition of done + test
      strategy, and an honest known-limits section. Prose in Turkish. Fail
      if a section is materially missing or the file is in English.
